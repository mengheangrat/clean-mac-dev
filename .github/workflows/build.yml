name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build app, .dmg and .pkg
        run: bash build.command

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CleanMacDev
          path: |
            dist/*.dmg
            dist/*.pkg

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.pkg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.pkg \
              --title "Clean Mac Dev $GITHUB_REF_NAME" \
              --notes-file .github/RELEASE_NOTES.md
          fi
